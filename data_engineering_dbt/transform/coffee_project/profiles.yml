coffee_project:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: coffee-shop-updated
      dataset: coffee_dev
      threads: 4
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"

    prod:
      type: bigquery
      method: service-account
      project: coffee-shop-updated
      dataset: coffee_prod
      threads: 4
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"