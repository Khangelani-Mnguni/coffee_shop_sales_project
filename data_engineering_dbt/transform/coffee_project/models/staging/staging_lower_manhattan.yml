version: 2

models:
  - name: staging_lower_manhattan
    description: "Cleaned and deduplicated transactions for Lower Manhattan"

    columns:
      - name: transaction_id
        description: "Primary key for transactions"
        tests:
          - not_null
          - unique

      - name: transaction_date
        description: "Parsed transaction date"

      - name: unit_price
        description: "Unit price of product"